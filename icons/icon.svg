<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0010;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#8b0044;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c80064;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe0f0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffb3d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff80c0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nailShine" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb3d9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)" />

  <!-- Subtle radial glow center -->
  <radialGradient id="centerGlow" cx="50%" cy="55%" r="50%">
    <stop offset="0%" style="stop-color:#c80064;stop-opacity:0.5" />
    <stop offset="100%" style="stop-color:#c80064;stop-opacity:0" />
  </radialGradient>
  <rect width="512" height="512" rx="100" ry="100" fill="url(#centerGlow)" />

  <!-- ── NAIL FINGER SHAPE (left) ── -->
  <g filter="url(#softShadow)">
    <!-- Finger body -->
    <rect x="108" y="210" width="88" height="185" rx="44" fill="#f9d0e8" />
    <!-- Nail plate -->
    <rect x="112" y="175" width="80" height="100" rx="40" fill="url(#nailGrad)" />
    <!-- Nail shine highlight -->
    <ellipse cx="138" cy="198" rx="16" ry="22" fill="url(#nailShine)" opacity="0.8" />
    <!-- Nail tip line -->
    <path d="M116 255 Q152 268 192 255" stroke="rgba(200,0,100,0.25)" stroke-width="2" fill="none" />
  </g>

  <!-- ── NAIL FINGER SHAPE (center, tallest) ── -->
  <g filter="url(#softShadow)">
    <rect x="212" y="185" width="88" height="210" rx="44" fill="#f9d0e8" />
    <rect x="216" y="148" width="80" height="105" rx="40" fill="url(#nailGrad)" />
    <ellipse cx="242" cy="172" rx="16" ry="24" fill="url(#nailShine)" opacity="0.8" />
    <path d="M220 228 Q256 242 296 228" stroke="rgba(200,0,100,0.25)" stroke-width="2" fill="none" />
  </g>

  <!-- ── NAIL FINGER SHAPE (right) ── -->
  <g filter="url(#softShadow)">
    <rect x="316" y="210" width="88" height="185" rx="44" fill="#f9d0e8" />
    <rect x="320" y="175" width="80" height="100" rx="40" fill="url(#nailGrad)" />
    <ellipse cx="346" cy="198" rx="16" ry="22" fill="url(#nailShine)" opacity="0.8" />
    <path d="M324 255 Q360 268 400 255" stroke="rgba(200,0,100,0.25)" stroke-width="2" fill="none" />
  </g>

  <!-- ── SPARKLE top-left ── -->
  <g filter="url(#glow)" opacity="0.9">
    <polygon points="80,80 86,96 102,96 89,106 94,122 80,112 66,122 71,106 58,96 74,96" fill="#ffffff" />
  </g>

  <!-- ── SPARKLE top-right ── -->
  <g filter="url(#glow)" opacity="0.75">
    <polygon points="432,68 436,80 448,80 438,87 442,99 432,92 422,99 426,87 416,80 428,80" fill="#ffb3d9" />
  </g>

  <!-- ── SMALL DIAMOND gem ── -->
  <g filter="url(#glow)">
    <polygon points="256,58 270,74 256,90 242,74" fill="url(#gemGrad)" opacity="0.95" />
    <polygon points="256,62 268,74 256,86 244,74" fill="rgba(255,255,255,0.4)" />
  </g>

  <!-- ── Bottom label band ── -->
  <rect x="60" y="408" width="392" height="58" rx="16" fill="rgba(255,255,255,0.10)" />

  <!-- GLOM text -->
  <text
    x="256" y="448"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="36"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="8"
  >GLOM</text>

  <!-- Thin accent line under GLOM -->
  <line x1="180" y1="455" x2="332" y2="455" stroke="rgba(255,179,217,0.6)" stroke-width="1.5" />

  <!-- Tiny dot accents on line ends -->
  <circle cx="180" cy="455" r="3" fill="#ffb3d9" opacity="0.8" />
  <circle cx="332" cy="455" r="3" fill="#ffb3d9" opacity="0.8" />

</svg>
